spring:
  application:
    name: wishlist-service

  # ---------------------------------------------------------------------------
  # Conexion a MySQL. Las credenciales se pueden sobreescribir por variables de
  # entorno; los valores por defecto son los del docker-compose / README.
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:carvajal_wishlist}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
    username: ${DB_USERNAME:wishlist_user}
    password: ${DB_PASSWORD:Wishlist2026*}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: wishlist-pool

  # ---------------------------------------------------------------------------
  # Capa de persistencia ORM (JPA / Hibernate).
  # ddl-auto: none  -> el esquema lo gobierna Flyway, no Hibernate.
  #                    (si quieres que Hibernate verifique el mapeo contra la BD
  #                     en desarrollo, cambialo a 'validate')
  # open-in-view: false -> evita mantener la sesion abierta en la capa web,
  #                        obliga a resolver los datos en el service.
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Bogota

  # ---------------------------------------------------------------------------
  # Flyway: los scripts en db/migration son los "scripts de creacion y
  # configuracion de la base de datos" que pide la prueba.
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

# -----------------------------------------------------------------------------
# Configuracion propia de la aplicacion
# -----------------------------------------------------------------------------
app:
  jwt:
    # En produccion esto SIEMPRE va por variable de entorno.
    # Minimo 32 bytes porque se firma con HMAC-SHA256.
    secret: ${JWT_SECRET:carvajal-wishlist-prueba-tecnica-2026-clave-de-desarrollo-no-usar-en-produccion}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    issuer: carvajal-wishlist
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.carvajal.wishlist: DEBUG
    org.flywaydb: INFO
