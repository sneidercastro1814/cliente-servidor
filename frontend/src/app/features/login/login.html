<div class="contenedor vista">
  <div class="caja-login">
    <div class="tarjeta">
      <div class="tarjeta-cuerpo">
        <h1>Ingresar</h1>
        <p class="subtitulo">Entra para ver y administrar tu lista de deseos.</p>

        @if (sesionVencida) {
          <div class="aviso aviso-advertencia" role="status">
            <div>
              <div class="aviso-titulo">Tu sesion vencio</div>
              Vuelve a ingresar para continuar.
            </div>
          </div>
        }

        @if (error()) {
          <div class="aviso aviso-peligro" role="alert">
            <div>{{ error() }}</div>
          </div>
        }

        <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
          <label class="campo">
            <span class="campo-etiqueta">Correo</span>
            <input
              class="entrada"
              [class.invalida]="email.touched && email.invalid"
              type="email"
              formControlName="email"
              autocomplete="username"
              placeholder="cliente@carvajal.com"
            />
            @if (email.touched && email.hasError('required')) {
              <span class="campo-error">El correo es obligatorio.</span>
            } @else if (email.touched && email.hasError('email')) {
              <span class="campo-error">Ese correo no tiene un formato valido.</span>
            }
          </label>

          <label class="campo">
            <span class="campo-etiqueta">Contrasena</span>
            <input
              class="entrada"
              [class.invalida]="password.touched && password.invalid"
              type="password"
              formControlName="password"
              autocomplete="current-password"
            />
            @if (password.touched && password.hasError('required')) {
              <span class="campo-error">La contrasena es obligatoria.</span>
            }
          </label>

          <button class="btn btn-primario btn-bloque" type="submit" [disabled]="cargando()">
            @if (cargando()) {
              <span class="girador"></span>
              Ingresando...
            } @else {
              Ingresar
            }
          </button>
        </form>
      </div>
    </div>

    <div class="credenciales">
      <div class="credenciales-titulo">Credenciales de prueba</div>
      <dl>
        <dt>Cliente</dt>
        <dd><code>cliente@carvajal.com</code> / <code>Carvajal2026*</code></dd>
        <dt>Administrador</dt>
        <dd><code>admin@carvajal.com</code> / <code>Admin2026*</code></dd>
      </dl>
    </div>
  </div>
</div>
