# =============================================================================
# nginx sirve la SPA y hace de proxy hacia la API.
# El nombre "backend" es el del servicio en docker-compose.
# =============================================================================

upstream api {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- API REST
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------- Documentacion de la API
    location /swagger-ui/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    location = /swagger-ui.html {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # ----------------------------------------------------- Estaticos con hash
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que un despliegue nuevo se vea de una
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ------------------------------------------- SPA: todo lo demas a index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
